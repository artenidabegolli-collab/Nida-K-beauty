<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4F7268">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rutina Ime K-Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#F7F2EC;
    --ink:#2B2420;
    --jade:#4F7268;
    --jade-light:#DCE7E2;
    --blush:#E3A9A0;
    --lavender:#C7B8D9;
    --line:rgba(43,36,32,0.14);
    --card:#FFFDFB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 80px;}

  header.hero{padding:8px 0 28px;border-bottom:1px solid var(--line);margin-bottom:28px;}
  .eyebrow{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--jade);font-weight:600;margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:450;font-size:34px;
    line-height:1.08;margin:0 0 12px;letter-spacing:-0.01em;
  }
  h1 em{font-style:italic;font-weight:300;color:var(--jade);}
  .sub{font-size:15px;line-height:1.55;color:rgba(43,36,32,0.72);margin:0;max-width:52ch;}

  .ladder{display:flex;gap:6px;margin:22px 0 30px;}
  .rung{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .3s;}
  .rung.done{background:var(--jade);}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:26px 22px;margin-bottom:16px;
  }
  .step-label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--jade);font-weight:600;margin-bottom:6px;}
  .q{font-family:'Fraunces',serif;font-size:22px;font-weight:450;margin:0 0 4px;}
  .q-note{font-size:13.5px;color:rgba(43,36,32,0.6);margin:0 0 18px;}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .opts.single-col{grid-template-columns:1fr;}
  .opt{
    border:1.5px solid var(--line);border-radius:13px;padding:14px 14px;
    background:#fff;cursor:pointer;font-size:14.5px;font-weight:500;
    text-align:left;transition:.15s;line-height:1.35;
    display:flex;flex-direction:column;gap:2px;
  }
  .opt small{font-weight:400;color:rgba(43,36,32,0.55);font-size:12px;}
  .opt:hover{border-color:var(--jade);}
  .opt.sel{border-color:var(--jade);background:var(--jade-light);}
  .opt.sel::after{content:"✓";float:right;color:var(--jade);font-weight:700;}

  .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px;}
  button{font-family:'Work Sans',sans-serif;cursor:pointer;}
  .btn-primary{
    background:var(--ink);color:var(--ivory);border:none;border-radius:100px;
    padding:13px 26px;font-size:14.5px;font-weight:600;letter-spacing:.02em;
  }
  .btn-primary:disabled{opacity:.35;cursor:not-allowed;}
  .btn-ghost{
    background:none;border:none;color:rgba(43,36,32,0.55);font-size:14px;
    padding:13px 8px;font-weight:500;
  }
  .btn-ghost:hover{color:var(--ink);}

  .photo-zone{
    border:1.5px dashed var(--line);border-radius:14px;padding:20px;
    text-align:center;margin-top:4px;
  }
  .photo-zone img{max-width:100%;max-height:220px;border-radius:10px;margin-top:12px;}
  .photo-zone input{display:none;}
  .upload-btn{
    display:inline-block;border:1.5px solid var(--jade);color:var(--jade);
    background:#fff;border-radius:100px;padding:9px 18px;font-size:13.5px;font-weight:600;
  }
  .visually-hidden-file{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  .howto{
    font-size:12px;color:rgba(43,36,32,0.62);margin:4px 0 0;line-height:1.5;
    font-style:italic;
  }
  .howto b{font-style:normal;color:var(--jade);font-weight:600;}
  .disclaimer{
    font-size:12px;color:rgba(43,36,32,0.55);margin-top:14px;line-height:1.5;
    background:var(--jade-light);border-radius:10px;padding:10px 12px;
  }

  .result-top{text-align:center;padding:6px 0 20px;}
  .result-top .eyebrow{justify-content:center;}
  .skin-tag{
    display:inline-block;background:var(--ink);color:var(--ivory);
    border-radius:100px;padding:6px 16px;font-size:13px;font-weight:600;margin-top:8px;
  }

  .tabs{display:flex;gap:8px;margin-bottom:24px;border-bottom:1px solid var(--line);}
  .tab{
    flex:1;text-align:center;padding:12px 6px;font-size:13.5px;font-weight:600;
    color:rgba(43,36,32,0.5);border:none;background:none;border-bottom:2px solid transparent;
    margin-bottom:-1px;cursor:pointer;
  }
  .tab.active{color:var(--jade);border-bottom-color:var(--jade);}

  .routine-block{margin-bottom:26px;}
  .routine-title{display:flex;align-items:center;gap:10px;margin:0 0 14px;}
  .routine-title h2{font-family:'Fraunces',serif;font-weight:450;font-size:19px;margin:0;}
  .routine-title .dot{width:8px;height:8px;border-radius:50%;background:var(--jade);}
  .routine-title.pm .dot{background:var(--lavender);}

  .step-item{display:flex;gap:14px;padding:15px 0;border-top:1px solid var(--line);}
  .step-num{font-family:'Fraunces',serif;font-size:15px;color:var(--jade);width:26px;flex-shrink:0;padding-top:1px;}
  .step-body h3{margin:0 0 3px;font-size:14.5px;font-weight:600;}
  .step-body p{margin:0 0 6px;font-size:13.5px;line-height:1.5;color:rgba(43,36,32,0.75);}
  .ingr{display:flex;flex-wrap:wrap;gap:6px;}
  .ingr span{font-size:11px;background:var(--jade-light);color:var(--jade);padding:3px 9px;border-radius:100px;font-weight:600;}
  .brands{font-size:12px;color:rgba(43,36,32,0.55);margin-top:5px;}
  .brands b{color:var(--ink);font-weight:600;}

  .weekly-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 20px 8px;margin-bottom:26px;}
  .weekly-box h2{font-family:'Fraunces',serif;font-size:18px;font-weight:450;margin:0 0 10px;}

  .photo-ref{margin:0 0 26px;}
  .photo-ref img{width:100%;border-radius:16px;display:block;}
  .photo-ref .cap{font-size:12px;color:rgba(43,36,32,0.55);margin-top:8px;line-height:1.5;}

  .restart{
    display:block;width:100%;text-align:center;margin-top:8px;
    background:none;border:1.5px solid var(--line);border-radius:100px;
    padding:13px;font-size:14px;font-weight:600;color:var(--ink);
  }

  /* PROGRESS TRACKER */
  .add-photo-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:24px;}
  .add-photo-card h2{font-family:'Fraunces',serif;font-size:18px;font-weight:450;margin:0 0 4px;}
  .add-photo-card .hint{font-size:13px;color:rgba(43,36,32,0.6);margin:0 0 14px;}
  .note-input{
    width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;
    font-family:'Work Sans',sans-serif;font-size:13.5px;margin-top:10px;resize:vertical;min-height:44px;
  }
  .save-entry{margin-top:12px;}

  .timeline{margin-bottom:28px;}
  .timeline h2{font-family:'Fraunces',serif;font-size:18px;font-weight:450;margin:0 0 14px;}
  .tl-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
  .tl-item{flex:0 0 auto;width:120px;}
  .tl-item img{width:120px;height:150px;object-fit:cover;border-radius:12px;display:block;border:1px solid var(--line);}
  .tl-item .tl-label{font-size:11.5px;font-weight:600;margin-top:6px;color:var(--jade);}
  .tl-item .tl-date{font-size:10.5px;color:rgba(43,36,32,0.5);}
  .tl-item .tl-note{font-size:11px;color:rgba(43,36,32,0.65);margin-top:2px;line-height:1.3;}
  .tl-remove{font-size:10.5px;color:rgba(43,36,32,0.4);background:none;border:none;margin-top:4px;text-decoration:underline;padding:0;}

  .compare{display:flex;gap:12px;margin-bottom:26px;}
  .compare .c-col{flex:1;text-align:center;}
  .compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:1px solid var(--line);}
  .compare .c-label{font-size:12px;font-weight:600;margin-top:8px;}
  .compare .c-sub{font-size:11px;color:rgba(43,36,32,0.55);}

  .expect-list{margin-bottom:26px;}
  .expect-item{
    display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line);
    position:relative;
  }
  .expect-item.now{background:var(--jade-light);border-radius:12px;padding:14px 12px;border-top:none;margin:4px 0;}
  .expect-week{font-family:'Fraunces',serif;font-size:13px;color:var(--jade);width:64px;flex-shrink:0;font-weight:600;}
  .expect-item.now .expect-week{color:var(--ink);}
  .expect-text h3{margin:0 0 3px;font-size:13.5px;font-weight:600;}
  .expect-text p{margin:0;font-size:12.5px;line-height:1.5;color:rgba(43,36,32,0.7);}
  .now-tag{font-size:10px;background:var(--ink);color:var(--ivory);padding:2px 8px;border-radius:100px;margin-left:8px;font-weight:700;vertical-align:middle;}

  .empty-state{text-align:center;padding:30px 20px;color:rgba(43,36,32,0.55);font-size:13.5px;}

  @media (max-width:400px){
    h1{font-size:28px;}
    .opts{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const state = {
  step: 0,
  skinType: null,
  concerns: [],
  sensitivity: null,
  age: null,
  photo: null,
  scanMetrics: null,
  scanNotes: [],
  suggestedConcerns: [],
  faceScanSkipped: false,
  view: 'results',        // 'results' | 'progress'
  progressLog: [],        // [{ts, photo, note}]
  storageReady: false,
  saving: false,
};

const STEPS = ['skinType','faceScan','concerns','sensitivity','age'];

const SKIN_TYPES = [
  {id:'oily', label:'Yndyrshme', note:'Shkëlqim gjatë ditës, poro të dukshme'},
  {id:'dry', label:'E thatë', note:'Ngurtësi, e tërhequr pas larjes'},
  {id:'combo', label:'Kombinuar', note:'Zona T yndyrshme, faqet e thata'},
  {id:'normal', label:'Normale', note:'E balancuar, pak probleme'},
  {id:'sensitive', label:'E ndjeshme', note:'Skuqet lehtë, reagon shpejt'},
  {id:'dehydrated', label:'E dehidratuar', note:'Mungon uji, mund të jetë edhe yndyrshme'},
];

const CONCERNS = [
  {id:'acne', label:'Akne / puçrra'},
  {id:'pigmentation', label:'Njolla / hiperpigmentim'},
  {id:'aging', label:'Rrudha / shenja plakjeje'},
  {id:'pores', label:'Poro të mëdhenj'},
  {id:'redness', label:'Skuqje / irritim'},
  {id:'dullness', label:'Ngjyrë e mpirë / pa shkëlqim'},
  {id:'texture', label:'Teksturë e pabarabartë'},
  {id:'dehydration', label:'Dehidratim'},
];

const SENSITIVITY = [
  {id:'low', label:'Aspak e ndjeshme', note:'Toleron gjithçka'},
  {id:'mid', label:'Mesatare', note:'Ndonjëherë skuqet'},
  {id:'high', label:'Shumë e ndjeshme', note:'Reagon shpejt, ka rozace/ekzemë'},
];

const AGE = [
  {id:'teen', label:'Nën 20'},
  {id:'20s', label:'20-29'},
  {id:'30s', label:'30-39'},
  {id:'40plus', label:'40+'},
];

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

/* ---------- STORAGE HELPERS ---------- */

async function loadPersisted(){
  try{
    const p = localStorage.getItem('kbeauty-profile');
    if(p){
      const prof = JSON.parse(p);
      state.skinType = prof.skinType;
      state.concerns = prof.concerns || [];
      state.sensitivity = prof.sensitivity;
      state.age = prof.age;
      state.step = STEPS.length;
    }
  }catch(e){ /* no profile saved yet */ }

  try{
    const l = localStorage.getItem('kbeauty-progress-log');
    if(l){ state.progressLog = JSON.parse(l); }
  }catch(e){ state.progressLog = []; }

  state.storageReady = true;
}

async function saveProfile(){
  try{
    localStorage.setItem('kbeauty-profile', JSON.stringify({
      skinType: state.skinType, concerns: state.concerns,
      sensitivity: state.sensitivity, age: state.age,
    }));
  }catch(e){ console.error('Nuk u ruajt profili', e); alert('Ruajtja dështoi — hapësira e ruajtjes së telefonit mund të jetë plot.'); }
}

async function saveProgressLog(){
  try{
    localStorage.setItem('kbeauty-progress-log', JSON.stringify(state.progressLog));
  }catch(e){ console.error('Nuk u ruajt regjistri', e); alert('Ruajtja e fotos dështoi — hapësira e ruajtjes së telefonit mund të jetë plot. Provo të fshish foto të vjetra.'); }
}

function compressImage(file, maxWidth, quality){
  maxWidth = maxWidth || 480; quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- FACE SCAN (heuristikë e thjeshtë drite/ngjyre — JO diagnozë) ---------- */

function analyzeFace(dataURL){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const w = img.width, h = img.height;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      // marrim vetëm zonën qendrore (supozohet fytyra) — jo detektim i vërtetë fytyre
      const rx = Math.round(w*0.22), ry = Math.round(h*0.14);
      const rw = Math.round(w*0.56), rh = Math.round(h*0.62);
      let data;
      try{ data = ctx.getImageData(rx, ry, rw, rh).data; }
      catch(e){ reject(e); return; }

      let n=0, sumL=0, sumR=0, sumG=0, sumB=0, bright=0;
      const lightnesses = [];
      for(let i=0; i<data.length; i+=4*4){ // sample çdo 4 piksel për shpejtësi
        const r=data[i], g=data[i+1], b=data[i+2];
        const l = 0.2126*r + 0.7152*g + 0.0722*b;
        sumL+=l; sumR+=r; sumG+=g; sumB+=b;
        lightnesses.push(l);
        if(l>235) bright++;
        n++;
      }
      if(n===0){ reject(new Error('no pixels')); return; }
      const avgL = sumL/n, avgR=sumR/n, avgG=sumG/n, avgB=sumB/n;
      const variance = lightnesses.reduce((a,v)=>a+(v-avgL)*(v-avgL),0)/n;
      resolve({
        avgL,
        stdDev: Math.sqrt(variance),
        redness: (avgR - (avgG+avgB)/2) / 255,
        shineRatio: bright/n,
      });
    };
    img.onerror = reject;
    img.src = dataURL;
  });
}

function interpretScan(m){
  const notes = [];
  const suggested = [];

  if(m.avgL < 85){
    notes.push({label:'Foto shumë e errët', detail:'Drita e paktë e bën vlerësimin jo të besueshëm. Provo përsëri me dritë natyrale nga përpara, jo nga pas.'});
  } else {
    if(m.redness > 0.055){
      notes.push({label:'Skuqje e dukshme', detail:'Nuancë e kuqe mbi normalen — mund të tregojë irritim ose akne aktive, por edhe ndriçim i ngrohtë e jep të njëjtin efekt.'});
      suggested.push('redness');
    }
    if(m.stdDev > 26){
      notes.push({label:'Ton jo uniform', detail:'Variacion i dukshëm i ndriçimit nëpër lëkurë — mund të lidhet me njolla ose teksturë të pabarabartë.'});
      suggested.push('texture'); suggested.push('pigmentation');
    }
    if(m.shineRatio > 0.10){
      notes.push({label:'Shkëlqim i lartë', detail:'Zona shumë të ndritshme mbi normalen — shpesh shoqërohet me lëkurë yndyrshme ose T-zonë aktive.'});
      suggested.push('pores');
    }
    if(m.avgL < 110 && m.shineRatio < 0.03){
      notes.push({label:'Pamje pak e mpirë', detail:'Ndriçim i ulët pa shkëlqim natyral — mund të lidhet me lëkurë të lodhur/të dehidratuar.'});
      suggested.push('dullness');
    }
    if(notes.length===0){
      notes.push({label:'Ton relativisht i qetë', detail:'Në dritën e kësaj fotoje, s\'u vunë re shqetësime dukshëm nga ngjyra/ndriçimi.'});
    }
  }
  return {notes, suggested: [...new Set(suggested)]};
}

/* ---------- RENDER ROOT ---------- */

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  if(!state.storageReady){
    app.appendChild(el('div','empty-state','Duke ngarkuar…'));
    return;
  }

  if(state.step < STEPS.length){
    app.appendChild(header());
    app.appendChild(ladder());
    app.appendChild(quizCard());
  } else if(state.view === 'progress'){
    app.appendChild(progressHeader());
    app.appendChild(tabs());
    app.appendChild(progressView());
  } else {
    app.appendChild(resultsHeader());
    app.appendChild(tabs());
    app.appendChild(resultsView());
  }
}

function header(){
  const h = el('header','hero');
  h.appendChild(el('div','eyebrow','Rutina Ime · K-Beauty'));
  const h1 = el('h1', state.step===0
    ? 'Gjej rutinën tënde <em>koreane</em> të lëkurës'
    : 'Pak hapa, e <em>pastaj</em> rutina jote');
  h.appendChild(h1);
  h.appendChild(el('p','sub','Përgjigju disa pyetjeve të shkurtra për tipin dhe nevojat e lëkurës. Në fund do të marrësh një rutinë K-beauty hap pas hapi, të përshtatur për ty — mëngjes dhe mbrëmje.'));
  return h;
}

function resultsHeader(){
  const h = el('header','hero');
  h.appendChild(el('div','eyebrow','Rutina Ime · K-Beauty'));
  h.appendChild(el('h1','Rutina e <em>përshtatur</em> për ty'));
  h.appendChild(el('p','sub','Ndiq rutinën më poshtë, dhe kalo te "Ecuria" për të ngarkuar foto periodike dhe për të parë kur pritet të shohësh efekt.'));
  return h;
}

function progressHeader(){
  const h = el('header','hero');
  h.appendChild(el('div','eyebrow','Rutina Ime · K-Beauty'));
  h.appendChild(el('h1','Ecuria e <em>lëkurës</em> tënde'));
  h.appendChild(el('p','sub','Shto një foto çdo javë për të krahasuar vizualisht ndryshimin, dhe shiko afatin tipik kur çdo lloj rezultati fillon të duket.'));
  return h;
}

function tabs(){
  const t = el('div','tabs');
  const b1 = el('button','tab'+(state.view==='results'?' active':''),'Rutina');
  b1.onclick = ()=>{ state.view='results'; render(); };
  const b2 = el('button','tab'+(state.view==='progress'?' active':''),'Ecuria e Fotove');
  b2.onclick = ()=>{ state.view='progress'; render(); };
  t.appendChild(b1); t.appendChild(b2);
  return t;
}

function ladder(){
  const wrap = el('div','ladder');
  STEPS.forEach((s,i)=>{
    wrap.appendChild(el('div','rung'+(i<=state.step?' done':'')));
  });
  return wrap;
}

function quizCard(){
  const card = el('div','card');
  const key = STEPS[state.step];

  if(key==='skinType'){
    card.appendChild(el('div','step-label','Hapi 1 nga 5'));
    card.appendChild(el('p','q','Si e përshkruan lëkurën tënde?'));
    card.appendChild(el('p','q-note','Zgjidh atë që i përshtatet më së shumti gjendjes zakonshme, jo vetëm sot.'));
    const opts = el('div','opts');
    SKIN_TYPES.forEach(o=>{
      const b = el('button','opt'+(state.skinType===o.id?' sel':''), o.label+'<small>'+o.note+'</small>');
      b.onclick = ()=>{ state.skinType=o.id; render(); };
      opts.appendChild(b);
    });
    card.appendChild(opts);
  }

  else if(key==='faceScan'){
    card.appendChild(el('div','step-label','Hapi 2 nga 5'));
    card.appendChild(el('p','q','Skano fytyrën'));
    card.appendChild(el('p','q-note','Bëj një foto me dritë natyrale nga përpara, pa filtër/grim të trashë, fytyra e centruar. Do të analizojmë ton, skuqje dhe shkëlqim — jo diagnozë, por një pikënisje për shqetësimet e hapit tjetër.'));
    const zone = el('div','photo-zone');
    const input = document.createElement('input');
    input.type='file'; input.accept='image/*'; input.capture='user'; input.className='visually-hidden-file';
    input.onchange = async (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      const zoneMsg = card.querySelector('.scan-status');
      if(zoneMsg) zoneMsg.textContent = 'Duke analizuar…';
      try{
        state.photo = await compressImage(f, 400, 0.75);
        const metrics = await analyzeFace(state.photo);
        const {notes, suggested} = interpretScan(metrics);
        state.scanMetrics = metrics;
        state.scanNotes = notes;
        state.suggestedConcerns = suggested;
        state.faceScanSkipped = false;
        render();
      }catch(err){
        console.error(err);
        alert('Nuk u analizua dot fotoja. Provo një foto tjetër ose kontrollo lejet e kamerës/galerisë.');
      }
    };
    const btn = document.createElement('button');
    btn.type='button'; btn.className='upload-btn'; btn.textContent = state.photo ? 'Ndrysho foton' : 'Bëj/Zgjidh foto';
    btn.onclick = ()=> input.click();
    zone.appendChild(btn);
    zone.appendChild(input);
    zone.appendChild(el('div','q-note scan-status',''));

    if(state.photo){
      const row = el('div');
      row.style.display='flex'; row.style.gap='14px'; row.style.marginTop='12px'; row.style.alignItems='flex-start';
      const img = el('img'); img.src = state.photo;
      img.style.width='110px'; img.style.borderRadius='12px'; img.style.flexShrink='0';
      row.appendChild(img);
      const notesWrap = el('div'); notesWrap.style.flex='1';
      state.scanNotes.forEach(n=>{
        const item = el('div'); item.style.marginBottom='8px';
        item.appendChild(el('div','', '<b style="font-size:13px;">'+n.label+'</b>'));
        item.appendChild(el('div','q-note', n.detail));
        notesWrap.appendChild(item);
      });
      row.appendChild(notesWrap);
      zone.appendChild(row);
    }
    card.appendChild(zone);
    card.appendChild(el('div','disclaimer','Kjo NUK është diagnozë dermatologjike — është vlerësim i thjeshtë i dritës/ngjyrës në foto, që ndikohet shumë nga ndriçimi dhe kamera. Në hapin tjetër mund t\'i ndryshosh lirisht shqetësimet e sugjeruara.'));
    if(!state.photo){
      const skip = el('div','btn-ghost','Kapërce skanimin, do i zgjedh vetë shqetësimet →');
      skip.style.cursor='pointer'; skip.style.marginTop='10px'; skip.style.fontSize='13px';
      skip.onclick = ()=>{ state.faceScanSkipped=true; state.step++; render(); };
      card.appendChild(skip);
    }
  }

  else if(key==='concerns'){
    card.appendChild(el('div','step-label','Hapi 3 nga 5'));
    card.appendChild(el('p','q','Cilat janë shqetësimet kryesore?'));
    const noteText = state.suggestedConcerns.length
      ? 'I para-zgjodhëm disa nga skanimi i fytyrës — ndrysho lirisht. Deri në 3 gjithsej.'
      : 'Mund të zgjedhësh disa. Zgjidh deri në 3 më të rëndësishmet.';
    card.appendChild(el('p','q-note', noteText));
    if(state.concerns.length===0 && state.suggestedConcerns.length>0){
      state.concerns = state.suggestedConcerns.slice(0,3);
    }
    const opts = el('div','opts');
    CONCERNS.forEach(o=>{
      const active = state.concerns.includes(o.id);
      const fromScan = state.suggestedConcerns.includes(o.id);
      const b = el('button','opt'+(active?' sel':''), o.label + (fromScan ? '<small>★ nga skanimi</small>' : ''));
      b.onclick = ()=>{
        if(active){ state.concerns = state.concerns.filter(c=>c!==o.id); }
        else if(state.concerns.length<3){ state.concerns.push(o.id); }
        render();
      };
      opts.appendChild(b);
    });
    card.appendChild(opts);
  }

  else if(key==='sensitivity'){
    card.appendChild(el('div','step-label','Hapi 4 nga 5'));
    card.appendChild(el('p','q','Sa e ndjeshme është lëkura?'));
    card.appendChild(el('p','q-note','Kjo ndikon fortësinë e aktivëve (BHA/AHA, retinoide) që rekomandojmë.'));
    const opts = el('div','opts single-col');
    SENSITIVITY.forEach(o=>{
      const b = el('button','opt'+(state.sensitivity===o.id?' sel':''), o.label+'<small>'+o.note+'</small>');
      b.onclick = ()=>{ state.sensitivity=o.id; render(); };
      opts.appendChild(b);
    });
    card.appendChild(opts);
  }

  else if(key==='age'){
    card.appendChild(el('div','step-label','Hapi 5 nga 5'));
    card.appendChild(el('p','q','Cila është mosha jote?'));
    card.appendChild(el('p','q-note','Përdoret vetëm për të kalibruar tekstura dhe aktivë anti-aging.'));
    const opts = el('div','opts');
    AGE.forEach(o=>{
      const b = el('button','opt'+(state.age===o.id?' sel':''), o.label);
      b.onclick = ()=>{ state.age=o.id; render(); };
      opts.appendChild(b);
    });
    card.appendChild(opts);
  }

  const nav = el('div','navrow');
  const back = el('button','btn-ghost', state.step===0 ? '' : '← Prapa');
  back.onclick = ()=>{ if(state.step>0){ state.step--; render(); } };
  if(state.step===0) back.style.visibility='hidden';

  const canNext = (()=>{
    if(key==='skinType') return !!state.skinType;
    if(key==='faceScan') return !!state.photo;
    if(key==='concerns') return state.concerns.length>0;
    if(key==='sensitivity') return !!state.sensitivity;
    if(key==='age') return !!state.age;
    return true;
  })();

  const nextLabel = key==='age' ? 'Shiko rutinën →' : 'Vazhdo →';
  const next = el('button','btn-primary', nextLabel);
  next.disabled = !canNext;
  next.onclick = async ()=>{
    if(!canNext) return;
    if(key==='age'){
      await saveProfile();
      if(state.photo){
        state.progressLog.push({ts: Date.now(), photo: state.photo, note: 'Foto fillestare (skanimi)'});
        await saveProgressLog();
      }
      state.step++; state.view='results';
      render();
      return;
    }
    state.step++; render();
  };

  nav.appendChild(back);
  nav.appendChild(next);
  card.appendChild(nav);

  return card;
}

  const serumMap = {

function stepRow(num, title, text, howTo, ingredients, brandList){
  const row = el('div','step-item');
  row.appendChild(el('div','step-num', String(num).padStart(2,'0')));
  const body = el('div','step-body');
  body.appendChild(el('h3', title));
  body.appendChild(el('p', text));
  if(ingredients && ingredients.length){
    const ing = el('div','ingr');
    ingredients.forEach(i=>ing.appendChild(el('span','', i)));
    body.appendChild(ing);
  }
  if(howTo){
    body.appendChild(el('div','howto', '<b>Si përdoret:</b> '+howTo));
  }
  if(brandList && brandList.length){
    body.appendChild(el('div','brands', '<b>Zgjidh njërën (jo të gjitha):</b> '+brandList.join(' · ')));
  }
  row.appendChild(body);
  return row;
}

  weekly.appendChild(stepRow('W3','Maskë nate', r.sleepMask, r.sleepMaskHow, null, r.sleepMaskBrands));
  frag.appendChild(weekly);

  frag.appendChild(el('div','disclaimer','Rekomandimet janë udhëzime të përgjithshme bazuar në përgjigjet e tua, jo diagnozë mjekësore. Testo çdo produkt të ri në një zonë të vogël të lëkurës (patch test) para përdorimit të plotë, dhe konsulto një dermatolog për shqetësime të vazhdueshme ose të rënda.'));

  const restart = el('button','restart','↺ Ribëj pyetësorin');
  restart.onclick = ()=>{
    state.step=0; state.skinType=null; state.concerns=[]; state.sensitivity=null; state.age=null; state.photo=null;
    render();
  };
  frag.appendChild(restart);

  return frag;
}

/* ---------- EXPECTED TIMELINE (bazuar në kohën tipike të përbërësve, jo analizë e fotos) ---------- */

function getTimelineData(topConcern){
  const base = [
    {weekMin:0, weekMax:1, label:'Java 0-1', title:'Hidratim i menjëhershëm', text:'Lëkura duket më e qetë dhe më e mbushur falë acidit hyaluronik dhe beta-glukanit. Ky është efekti më i shpejtë, por sipërfaqësor.'},
    {weekMin:1, weekMax:2, label:'Java 1-2', title:'Ulje e skuqjes dhe irritimit', text:'Centella, panthenol dhe propolis fillojnë të qetësojnë barrierën e lëkurës, veçanërisht nëse ka pasur skuqje.'},
    {weekMin:2, weekMax:4, label:'Java 2-4', title:'Rregullim i sebumit dhe poreve', text:'Niacinamide fillon të tregojë efekt në yndyrshmëri dhe pamjen e poreve. Teksturë pak më e njëtrajtshme.'},
    {weekMin:4, weekMax:6, label:'Java 4-6', title:'Përmirësim i aknes së lehtë', text:'BHA/acid salicilik dhe tea tree fillojnë të ulin numrin e puçrrave të reja, nëse rutina ndiqet rregullisht.'},
    {weekMin:6, weekMax:8, label:'Java 6-8', title:'Teksturë dhe shkëlqim', text:'Snail mucin dhe PHA ndihmojnë lëmimin e sipërfaqes; lëkura fillon të reflektojë dritën më mirë.'},
    {weekMin:8, weekMax:12, label:'Java 8-12', title:'Zbutje e njollave dhe pigmentimit', text:'Vitamina C dhe arbutin marrin kohë më të gjatë — njollat e vjetra fillojnë të zbuten dukshëm këtu, jo më herët.'},
    {weekMin:12, weekMax:20, label:'Java 12+', title:'Elasticitet dhe shenja plakjeje', text:'Peptide, ginseng dhe bakuchiol japin rezultatet e tyre më të dukshme vetëm pas 3 muajsh përdorim të vazhdueshëm.'},
  ];
  const priority = {
    dehydration:0, redness:1, pores:2, texture:2, acne:3, dullness:4, pigmentation:5, aging:6,
  };
  const highlightIdx = priority[topConcern] !== undefined ? priority[topConcern] : 2;
  return {items: base, highlightIdx};
}

function weeksSince(ts){
  return Math.floor((Date.now() - ts) / (7*24*60*60*1000));
}

function progressView(){
  const frag = el('div');

  if(!state.skinType){
    frag.appendChild(el('div','empty-state','Plotëso pyetësorin fillimisht që të ruajmë profilin tënd të lëkurës.'));
    const back = el('button','btn-primary','← Shko te pyetësori');
    back.style.display='block'; back.style.margin='0 auto';
    back.onclick = ()=>{ state.step=0; render(); };
    frag.appendChild(back);
    return frag;
  }

  // add photo card
  const addCard = el('div','add-photo-card');
  addCard.appendChild(el('h2','Shto foton e sotme'));
  addCard.appendChild(el('p','hint','Bëje në të njëjtën dritë dhe kënd çdo herë për krahasim më të saktë.'));
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*'; input.className='visually-hidden-file';
  let pendingPhoto = null;
  const previewWrap = el('div');
  const noteInput = el('textarea','note-input');
  noteInput.placeholder = 'Shënim (opsionale) — p.sh. "pak skuqje sot"';
  const saveBtn = el('button','btn-primary save-entry','Ruaj foton e sotme');
  saveBtn.disabled = true;

  input.onchange = async (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    try{
      pendingPhoto = await compressImage(f);
      previewWrap.innerHTML = '';
      const img = el('img'); img.src = pendingPhoto;
      img.style.maxWidth='160px'; img.style.borderRadius='10px'; img.style.marginTop='10px';
      previewWrap.appendChild(img);
      saveBtn.disabled = false;
    }catch(err){
      console.error(err);
      alert('Nuk u ngarkua dot fotoja. Provo një foto tjetër ose kontrollo lejet e kamerës/galerisë.');
    }
  };
  const btn = document.createElement('button');
  btn.type='button'; btn.className='upload-btn'; btn.textContent='Zgjidh foto';
  btn.onclick = ()=> input.click();
  addCard.appendChild(btn);
  addCard.appendChild(input);
  addCard.appendChild(previewWrap);
  addCard.appendChild(noteInput);

  saveBtn.onclick = async ()=>{
    if(!pendingPhoto) return;
    saveBtn.disabled = true; saveBtn.textContent = 'Duke ruajtur…';
    state.progressLog.push({ts: Date.now(), photo: pendingPhoto, note: noteInput.value.trim()});
    await saveProgressLog();
    render();
  };
  addCard.appendChild(saveBtn);
  frag.appendChild(addCard);

  const log = [...state.progressLog].sort((a,b)=>a.ts-b.ts);

  if(log.length===0){
    frag.appendChild(el('div','empty-state','Ende nuk ke shtuar asnjë foto. Shtoje të parën më sipër për të nisur gjurmimin.'));
  } else {
    const firstTs = log[0].ts;

    // timeline strip
    const tlSection = el('div','timeline');
    tlSection.appendChild(el('h2','Rrjedha kohore'));
    const scroll = el('div','tl-scroll');
    log.forEach((entry, i)=>{
      const item = el('div','tl-item');
      const img = el('img'); img.src = entry.photo;
      item.appendChild(img);
      const wk = weeksSince(entry.ts) === 0 ? Math.floor((entry.ts-firstTs)/(7*24*60*60*1000)) : Math.floor((entry.ts-firstTs)/(7*24*60*60*1000));
      const label = i===0 ? 'Fillimi' : ('Java '+wk);
      item.appendChild(el('div','tl-label', label));
      item.appendChild(el('div','tl-date', new Date(entry.ts).toLocaleDateString('sq-AL')));
      if(entry.note){ item.appendChild(el('div','tl-note', entry.note)); }
      const rm = el('button','tl-remove','fshi');
      rm.onclick = async ()=>{
        state.progressLog = state.progressLog.filter(e=>e.ts!==entry.ts);
        await saveProgressLog();
        render();
      };
      item.appendChild(rm);
      scroll.appendChild(item);
    });
    tlSection.appendChild(scroll);
    frag.appendChild(tlSection);

    // compare first vs latest
    if(log.length>=2){
      const cmp = el('div','timeline');
      cmp.appendChild(el('h2','Krahaso: fillimi vs. sot'));
      const row = el('div','compare');
      const first = log[0], last = log[log.length-1];
      const c1 = el('div','c-col');
      const i1 = el('img'); i1.src = first.photo; c1.appendChild(i1);
      c1.appendChild(el('div','c-label','Fillimi'));
      c1.appendChild(el('div','c-sub', new Date(first.ts).toLocaleDateString('sq-AL')));
      const c2 = el('div','c-col');
      const i2 = el('img'); i2.src = last.photo; c2.appendChild(i2);
      c2.appendChild(el('div','c-label','Java '+Math.floor((last.ts-first.ts)/(7*24*60*60*1000))));
      c2.appendChild(el('div','c-sub', new Date(last.ts).toLocaleDateString('sq-AL')));
      row.appendChild(c1); row.appendChild(c2);
      cmp.appendChild(row);
      cmp.appendChild(el('p','hint','Krahasimi është vetëm vizual, për vlerësimin tënd personal — aplikacioni nuk analizon automatikisht fotot për të matur përmirësimin.'));
      frag.appendChild(cmp);
    }

    // expected timeline
    const r = buildRoutine();
    const {items, highlightIdx} = getTimelineData(r.topConcern);
    const curWeek = Math.floor((Date.now()-firstTs)/(7*24*60*60*1000));
    const exp = el('div','expect-list');
    exp.appendChild(el('h2','Kur pritet efekt optimal'));
    exp.appendChild(el('p','hint','Bazuar te përbërësit e rekomanduar për shqetësimin tënd kryesor ('+CONCERN_LABELS[r.topConcern]+') — janë afate tipike të njohura për këta aktivë, jo parashikim i personalizuar nga fotoja jote.'));
    items.forEach((it,idx)=>{
      const isNow = curWeek>=it.weekMin && curWeek<it.weekMax;
      const isTarget = idx===highlightIdx;
      const row = el('div','expect-item'+(isNow?' now':''));
      row.appendChild(el('div','expect-week', it.label));
      const body = el('div','expect-text');
      const titleHtml = it.title + (isTarget?' <span class="now-tag" style="background:var(--jade);">FOKUSI YT</span>':'') + (isNow?' <span class="now-tag">TANI</span>':'');
      body.appendChild(el('h3', titleHtml));
      body.appendChild(el('p', it.text));
      row.appendChild(body);
      exp.appendChild(row);
    });
    frag.appendChild(exp);
  }

  frag.appendChild(el('div','disclaimer','Fotot ruhen vetëm në llogarinë/pajisjen tënde. Krahasimi vizual është subjektiv — për vlerësim objektiv të ecurisë (p.sh. akne e rëndë, pigmentim i thellë), konsulto një dermatolog.'));

  return frag;
}

/* ---------- INIT ---------- */

(async function init(){
  render(); // loading state
  await loadPersisted();
  render();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.log('SW nuk u regjistrua:', e));
  });
}
</script>
